server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
